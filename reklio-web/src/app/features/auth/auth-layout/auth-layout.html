<div class="auth-shell">
  <aside class="brand">
    <div>
      <div class="brand__logo">
        <img class="brand__mark" src="/logo.png" alt="Reklio" />
        <span class="brand__name">Reklio</span>
      </div>
      <h1 class="brand__heading">{{ heading() }}</h1>
      <p class="brand__text">{{ subheading() }}</p>
    </div>

    <div class="scan">
      <div class="scan__file">Vaša reklamacija u 3 koraka</div>
      <div class="scan__frame">
        <div class="scan__line"></div>

        <div class="scan__step">
          <span class="scan__step-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
              <path d="M6 2h9l3 3v16l-3-1.5L12 21l-3-1.5L6 21V2Z" /><path d="M9 8h6" /><path d="M9 12h6" /><path d="M9 16h4" />
            </svg>
          </span>
          <span class="scan__step-label">Priložite račun</span>
        </div>

        <div class="scan__step">
          <span class="scan__step-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
              <rect x="3" y="6" width="18" height="14" rx="2" /><circle cx="12" cy="13" r="3.4" /><path d="M8 6l1.5-2h5L16 6" />
            </svg>
          </span>
          <span class="scan__step-label">Dodajte fotografije oštećenja</span>
        </div>

        <div class="scan__step">
          <span class="scan__step-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
              <path d="M4 7h16" /><path d="M4 12h16" /><path d="M4 17h10" />
            </svg>
          </span>
          <span class="scan__step-label">Opišite problem</span>
        </div>
      </div>

      <div class="scan__foot">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M5 12.5l4.5 4.5L19 7.5" />
        </svg>
        AI i operater rade ostalo
      </div>
    </div>
  </aside>

  <section class="form-panel" [class.form-panel--top]="alignTop()">
    <div class="form-inner">
      <ng-content></ng-content>
    </div>
  </section>
</div>
