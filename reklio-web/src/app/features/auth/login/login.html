<app-auth-layout
  heading="Reklamacije, riješene pametnije."
  subheading="AI analizira dokaze i uslove garancije — jasne slučajeve riješi odmah, a operater provjeri one složenije."
  [alignTop]="true"
>
  <h2 class="auth-title">Prijava</h2>
  <p class="auth-subtitle">Unesite podatke da nastavite.</p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    @if (errorMessage()) {
      <div class="auth-error">{{ errorMessage() }}</div>
    }

    <label class="auth-field">
      <span class="auth-field__label">Email</span>
      <input
        type="email"
        class="auth-field__input"
        placeholder="ime@primjer.com"
        formControlName="email"
        [class.is-invalid]="form.controls.email.touched && form.controls.email.invalid"
      />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <span class="auth-field__error">Unesite ispravan email.</span>
      }
    </label>

    <label class="auth-field">
      <span class="auth-field__label">Lozinka</span>
      <div class="auth-field__pw">
        <input
          [type]="showPassword() ? 'text' : 'password'"
          class="auth-field__input"
          placeholder="••••••••"
          formControlName="password"
          [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid"
        />
        <button type="button" class="pw-toggle" (click)="togglePassword()"
                [attr.aria-label]="showPassword() ? 'Sakrij lozinku' : 'Prikaži lozinku'">
          @if (showPassword()) {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
              <path d="M3 3l18 18" /><path d="M10.6 10.6a3 3 0 0 0 4.2 4.2" />
              <path d="M9.9 5.1A9.6 9.6 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 3.9" />
              <path d="M6.1 6.1A16.8 16.8 0 0 0 2 12s3.5 7 10 7c1.4 0 2.7-.3 3.9-.7" />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" /><circle cx="12" cy="12" r="3" />
            </svg>
          }
        </button>
      </div>
    </label>


    <button type="submit" class="auth-submit" [disabled]="submitting()">
      {{ submitting() ? 'Prijava...' : 'Prijavite se' }}
    </button>
  </form>

  <div class="auth-divider">ili</div>

  <div class="auth-switch">
    Nemate nalog? <a routerLink="/register">Registrujte se →</a>
  </div>
</app-auth-layout>
