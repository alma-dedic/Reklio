<div class="bell">
  <button type="button" class="bell__btn" (click)="toggle()"
          [attr.aria-expanded]="open()" aria-haspopup="true" aria-label="Obavještenja">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
      <path d="M6 9a6 6 0 1 1 12 0c0 3.6 1 5 1.8 5.7.4.3.2 1.3-.4 1.3H4.6c-.6 0-.8-1-.4-1.3C5 14 6 12.6 6 9Z" />
      <path d="M10 19a2 2 0 0 0 4 0" />
    </svg>
    @if (unread() > 0) {
      <span class="bell__badge">{{ unread() > 9 ? '9+' : unread() }}</span>
    }
  </button>

  @if (open()) {
    <div class="bell__backdrop" (click)="close()"></div>
    <div class="bell__panel" role="menu">
      <div class="bell__head">
        <span>Obavještenja</span>
        @if (unread() > 0) {
          <button type="button" class="bell__markall" (click)="markAllRead()">Označi sve pročitano</button>
        }
      </div>

      @if (loading()) {
        <div class="bell__empty">Učitavanje...</div>
      } @else if (items().length === 0) {
        <div class="bell__empty">Nema obavještenja.</div>
      } @else {
        <ul class="bell__list">
          @for (n of items(); track n.id) {
            <li>
              <button type="button" class="bell__item" [class.bell__item--unread]="!n.isRead"
                      (click)="onItem(n)">
                @if (!n.isRead) { <span class="bell__dot"></span> }
                <span class="bell__text">
                  <span class="bell__ref mono">{{ n.claimReference }}</span>
                  <span class="bell__msg">{{ n.message }}</span>
                  <span class="bell__time">{{ timeAgo(n.createdAt) }}</span>
                </span>
              </button>
            </li>
          }
        </ul>
      }
    </div>
  }
</div>
