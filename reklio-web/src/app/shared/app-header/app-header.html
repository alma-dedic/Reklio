<header class="appbar">
  <div class="appbar__inner">
    <a class="brand" [routerLink]="homeLink()">
      <span class="brand__mark">R</span>
      <span class="brand__name">Reklio</span>
    </a>

    <div class="actions">
      @if (showNotifications()) {
        <button type="button" class="iconbtn" aria-label="Obavještenja" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <path d="M6 9a6 6 0 1 1 12 0c0 3.6 1 5 1.8 5.7.4.3.2 1.3-.4 1.3H4.6c-.6 0-.8-1-.4-1.3C5 14 6 12.6 6 9Z" />
            <path d="M10 19a2 2 0 0 0 4 0" />
          </svg>
        </button>
      }

      <div class="account">
        <button type="button" class="avatar" (click)="toggleMenu()"
                [attr.aria-expanded]="menuOpen()" aria-haspopup="menu" aria-label="Nalog">
          {{ initials() }}
        </button>

        @if (menuOpen()) {
          <div class="menu-backdrop" (click)="closeMenu()"></div>
          <div class="menu" role="menu">
            <div class="menu__id">
              <div class="menu__name">{{ user()?.fullName }}</div>
              <div class="menu__email">{{ user()?.email }}</div>
            </div>
            <div class="menu__divider"></div>
            <button type="button" class="menu__item" role="menuitem" (click)="logout()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
                <path d="M15 12H4" /><path d="M9 8l-4 4 4 4" />
                <path d="M13 4h5a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-5" />
              </svg>
              Odjava
            </button>
          </div>
        }
      </div>
    </div>
  </div>
</header>
